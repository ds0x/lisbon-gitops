# Teams are available in Fleet Premium.

# This file updates policies, controls, and software for hosts assigned to "No team."

# To update queries and agent options for hosts assigned to "No team," use the default.yml file.

name: No team
policies:
queries:
  - path: ../lib/all/queries/router-address.yml
controls: # This cannot be set here and in default.yml
  windows_enabled_and_configured: true
  macos_settings:
    custom_settings:
      - path: ../lib/macos/configuration-profiles/self-service.mobileconfig
      - path: ../lib/macos/configuration-profiles/AppleScript-PPPC.mobileconfig
      - path: ../lib/ios/configuration-profiles/lock-screen-message.mobileconfig
      - path: ../lib/ios/declaration-profiles/swupd-settings.json
software:
  app_store_apps:
    - app_store_id: "311421597"
      self_service: true
      setup_experience: true
    - app_store_id: "311421597"
      self_service: true
      setup_experience: true
    - app_store_id: "324715238"
      self_service: true
    - app_store_id: "6755752326"
      self_service: true
    - app_store_id: "300311831"
      self_service: true
    - app_store_id: "341776037"
      self_service: true
    - app_store_id: "430255202"
      platform: darwin
      setup_experience: true
      self_service: true
    - app_store_id: "com.evo.inware"
      platform: android
      setup_experience: true
      self_service: true
  fleet_maintained_apps:
    - slug: transmit/darwin # Privileges for macOS
      setup_experience: true
      self_service: true
