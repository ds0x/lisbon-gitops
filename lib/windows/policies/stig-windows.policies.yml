# DISA STIG Windows 11 V2R6 / Windows 10 V3R7 - Windows Policies
# Applied to the "Compliant DISA-STIG" team only.

- name: Windows - STIG - NTLMv2 only; LM and NTLMv1 refused (WN11-CC-000068) [STIG-unique]
  platform: windows
  description: "DISA STIG WN11-CC-000068: The LAN Manager authentication level must be configured to send NTLMv2 responses only and refuse LM and NTLM. This is STIG-specific hardening against credential downgrade attacks."
  resolution: "Deploy the STIG Windows monoprofile (stig-windows-monoprofile.xml) which sets NetworkSecurity_LANManagerAuthenticationLevel=5."
  query: |
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
      AND name = 'LmCompatibilityLevel'
      AND CAST(data AS INTEGER) >= 5;

- name: Windows - STIG - Credential Guard enabled (WN11-CC-000075) [STIG-unique]
  platform: windows
  description: "DISA STIG WN11-CC-000075: Windows Defender Credential Guard must be enabled to protect credentials from Pass-the-Hash and Pass-the-Ticket attacks."
  resolution: "Deploy the STIG Windows monoprofile (stig-windows-monoprofile.xml) which sets LsaCfgFlags=1 (enabled with UEFI lock)."
  query: |
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\DeviceGuard'
      AND name = 'LsaCfgFlags'
      AND CAST(data AS INTEGER) >= 1;

- name: Windows - STIG - SMBv1 server disabled (WN11-000340) [STIG-unique]
  platform: windows
  description: "DISA STIG WN11-000340: SMBv1 must be disabled on the system to prevent EternalBlue-type exploits and legacy protocol attacks."
  resolution: "Run 'Set-SmbServerConfiguration -EnableSMB1Protocol $false' in PowerShell as Administrator, or deploy via Group Policy."
  query: |
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      AND name = 'SMB1'
      AND CAST(data AS INTEGER) = 0
    UNION
    SELECT 1 WHERE NOT EXISTS (
      SELECT 1 FROM registry
      WHERE key = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
        AND name = 'SMB1'
    );

- name: Windows - STIG - WinRM Basic Authentication disabled (WN11-CC-000330) [STIG-unique]
  platform: windows
  description: "DISA STIG WN11-CC-000330: WinRM must not use Basic Authentication as it transmits credentials in an unencrypted form."
  resolution: "Deploy the STIG Windows monoprofile (stig-windows-monoprofile.xml) which sets AllowBasicAuthentication_Service=0."
  query: |
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      AND name = 'AllowBasicAuthentication'
      AND CAST(data AS INTEGER) = 0
    UNION
    SELECT 1 WHERE NOT EXISTS (
      SELECT 1 FROM registry
      WHERE key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
        AND name = 'AllowBasicAuthentication'
    );

- name: Windows - STIG - Account lockout after 3 failed attempts (WN11-AC-000010 / AC-7)
  platform: windows
  description: "DISA STIG WN11-AC-000010: The account lockout threshold must be set to 3 or fewer invalid logon attempts."
  resolution: "Deploy the STIG Windows monoprofile (stig-windows-monoprofile.xml)."
  query: |
    SELECT 1 FROM mdm_bridge
    WHERE mdm_command_input = "<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Policy/Config/DeviceLock/MaxDevicePasswordFailedAttempts</LocURI></Target></Item></Get></SyncBody>"
      AND CAST(mdm_command_output AS INT) <= 3
      AND CAST(mdm_command_output AS INT) > 0;

- name: Windows - STIG - Windows Defender real-time protection enabled (WN11-CC-000060 / SI-3)
  platform: windows
  description: "DISA STIG WN11-CC-000060: Windows Defender real-time protection must be active to detect and prevent malicious code execution."
  resolution: "Enable Windows Defender real-time protection via MDM or Group Policy."
  query: |
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection'
      AND name = 'DisableRealtimeMonitoring'
      AND CAST(data AS INTEGER) = 0
    UNION
    SELECT 1 WHERE NOT EXISTS (
      SELECT 1 FROM registry
      WHERE key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection'
        AND name = 'DisableRealtimeMonitoring'
    );

- name: Windows - STIG - Windows Event Log service running (WN11-AU-000010 / AU-12)
  platform: windows
  description: "DISA STIG WN11-AU-000010: The Windows Event Log service must be running to maintain an audit trail of system activity."
  resolution: "Enable and start the Windows Event Log service: 'sc config eventlog start= auto && net start eventlog'."
  query: |
    SELECT 1 FROM services
    WHERE name = 'EventLog'
      AND status = 'RUNNING'
      AND start_type = 'AUTO_START';

- name: Windows - STIG - Autorun disabled for all drives (WN11-SO-000150 / CM-7)
  platform: windows
  description: "DISA STIG WN11-SO-000150: Autorun must be disabled for all drives to prevent automatic execution of malicious code from removable media."
  resolution: "Set registry key HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\NoDriveTypeAutoRun = 255."
  query: |
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      AND name = 'NoDriveTypeAutoRun'
      AND CAST(data AS INTEGER) = 255;
