# NIST SP 800-53 Rev 5 High Baseline - Windows Policies
# These policies provide evidence for 800-53 High Impact audits.
# Applied to the "Compliant 800-53" team only.

- name: Windows - 800-53 - Account lockout after 3 failed attempts (AC-7)
  platform: windows
  description: "800-53 AC-7: The device must lock the account after no more than 3 consecutive invalid login attempts."
  resolution: "Deploy the 800-53 Windows monoprofile (800-53-windows-monoprofile.xml) which sets MaxDevicePasswordFailedAttempts to 3."
  query: |
    SELECT 1 FROM mdm_bridge
    WHERE mdm_command_input = "<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Policy/Config/DeviceLock/MaxDevicePasswordFailedAttempts</LocURI></Target></Item></Get></SyncBody>"
      AND CAST(mdm_command_output AS INT) <= 3
      AND CAST(mdm_command_output AS INT) > 0;

- name: Windows - 800-53 - Screen lock after 15 minutes (AC-11)
  platform: windows
  description: "800-53 AC-11: Session lock must activate after no more than 15 minutes of inactivity."
  resolution: "Deploy the 800-53 Windows monoprofile (800-53-windows-monoprofile.xml) which sets MaxInactivityTimeDeviceLock to 15."
  query: |
    SELECT 1 FROM mdm_bridge
    WHERE mdm_command_input = "<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Policy/Config/DeviceLock/MaxInactivityTimeDeviceLock</LocURI></Target></Item></Get></SyncBody>"
      AND CAST(mdm_command_output AS INT) <= 15
      AND CAST(mdm_command_output AS INT) > 0;

- name: Windows - 800-53 - Minimum password length 15 characters (IA-5)
  platform: windows
  description: "800-53 IA-5: Authenticator management requires a minimum password length of 15 characters."
  resolution: "Deploy the 800-53 Windows monoprofile (800-53-windows-monoprofile.xml) which sets MinDevicePasswordLength to 15."
  query: |
    SELECT 1 FROM mdm_bridge
    WHERE mdm_command_input = "<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Policy/Config/DeviceLock/MinDevicePasswordLength</LocURI></Target></Item></Get></SyncBody>"
      AND CAST(mdm_command_output AS INT) >= 15;

- name: Windows - 800-53 - Password expiration max 60 days (IA-5)
  platform: windows
  description: "800-53 IA-5: Passwords must be changed at least every 60 days to limit the window of exposure for compromised credentials."
  resolution: "Deploy the 800-53 Windows monoprofile (800-53-windows-monoprofile.xml) which sets DevicePasswordExpiration to 60."
  query: |
    SELECT 1 FROM mdm_bridge
    WHERE mdm_command_input = "<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Policy/Config/DeviceLock/DevicePasswordExpiration</LocURI></Target></Item></Get></SyncBody>"
      AND CAST(mdm_command_output AS INT) <= 60
      AND CAST(mdm_command_output AS INT) > 0;

- name: Windows - 800-53 - Windows Defender real-time protection enabled (SI-3)
  platform: windows
  description: "800-53 SI-3: Malicious code protection (Windows Defender real-time protection) must be active on all endpoints."
  resolution: "Enable Windows Defender real-time protection via MDM or Group Policy. Ensure no conflicting AV software has disabled Defender."
  query: |
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection'
      AND name = 'DisableRealtimeMonitoring'
      AND CAST(data AS INTEGER) = 0
    UNION
    SELECT 1 WHERE NOT EXISTS (
      SELECT 1 FROM registry
      WHERE key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection'
        AND name = 'DisableRealtimeMonitoring'
    );

- name: Windows - 800-53 - Audit logging enabled (AU-12)
  platform: windows
  description: "800-53 AU-12: Windows Event Log service must be running to generate and retain audit records."
  resolution: "Enable and start the Windows Event Log service: 'sc config eventlog start= auto && net start eventlog'."
  query: |
    SELECT 1 FROM services
    WHERE name = 'EventLog'
      AND status = 'RUNNING'
      AND start_type = 'AUTO_START';
