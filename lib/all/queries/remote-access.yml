- name: Remote access audit
  description: Checks common remote access configurations to ensure compliance.
  query: WITHssh_listen AS (  SELECT COUNT(1) AS c  FROM listening_ports lp  JOIN processes p ON lp.pid = p.pid  WHERE lp.port = 22),host_keys AS (  SELECT path FROM file  WHERE path LIKE '/etc/ssh/ssh_host_%_key.pub'),host_key_types AS (  SELECT    SUM(CASE WHEN path LIKE '%ed25519%' THEN 1 ELSE 0 END) AS has_ed25519,    SUM(CASE WHEN path LIKE '%ecdsa%'   THEN 1 ELSE 0 END) AS has_ecdsa,    SUM(CASE WHEN path LIKE '%rsa%'     THEN 1 ELSE 0 END) AS has_rsa,    SUM(CASE WHEN path LIKE '%dsa%'     THEN 1 ELSE 0 END) AS has_dsa,    GROUP_CONCAT(REPLACE(REPLACE(REPLACE(REPLACE(path,      '/etc/ssh/ssh_host_', ''), '_key.pub',''),'_',''),'ssh_host_','')) AS raw_list  FROM host_keys),sshd_hash AS (  SELECT md5 FROM hash WHERE path = '/etc/ssh/sshd_config' LIMIT 1),moduli_meta AS (  SELECT path, size FROM file WHERE path = '/etc/ssh/moduli')SELECT  (SELECT c FROM ssh_listen)                              AS ssh_listening,  (SELECT has_ed25519 FROM host_key_types)               AS has_ed25519,  (SELECT has_ecdsa   FROM host_key_types)               AS has_ecdsa,  (SELECT has_rsa     FROM host_key_types)               AS has_rsa,  (SELECT has_dsa     FROM host_key_types)               AS has_dsa,  (SELECT raw_list    FROM host_key_types)               AS host_key_files,  (SELECT md5 FROM sshd_hash)                            AS sshd_md5,  (SELECT size FROM moduli_meta)                         AS moduli_size,  CASE    WHEN (SELECT c FROM ssh_listen) = 0 THEN 1    WHEN (SELECT has_dsa FROM host_key_types) > 0 THEN 0    WHEN (SELECT has_ed25519 FROM host_key_types) > 0        OR (SELECT has_ecdsa   FROM host_key_types) > 0 THEN 1    ELSE 0  END AS ssh_crypto_reasonable,  CASE    WHEN (SELECT c FROM ssh_listen) = 0 THEN 1    WHEN (SELECT has_dsa FROM host_key_types) > 0 THEN 0    WHEN (SELECT has_ed25519 FROM host_key_types) > 0        OR (SELECT has_ecdsa FROM host_key_types) > 0 THEN 1    ELSE 0  END AS remote_access_confidentiality_host_view;  interval: 360 # 6 minutes
  observer_can_run: true
  automations_enabled: false
  platform: darwin,linux
