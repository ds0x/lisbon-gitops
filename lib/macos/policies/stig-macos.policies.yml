# DISA STIG macOS Sequoia V1R6 (Feb 2026) - macOS Policies
# Applied to the "Compliant DISA-STIG" team only.
#
# Note: macos-device-health.policies.yml runs globally (default.yml) — not duplicated here.
# These policies cover STIG-specific controls not addressed in that baseline.

- name: macOS - STIG - Gatekeeper enabled (APPL-15-002060 / CM-7)
  platform: darwin
  description: "DISA STIG APPL-15-002060: Gatekeeper must be enabled to prevent execution of unsigned or malicious applications."
  resolution: "Run 'sudo spctl --master-enable' in Terminal, or deploy a Gatekeeper restriction profile."
  query: SELECT 1 FROM gatekeeper WHERE assessments_enabled = 1;

- name: macOS - STIG - System Integrity Protection enabled (APPL-15-002100 / SI-7)
  platform: darwin
  description: "DISA STIG APPL-15-002100: SIP must be enabled to protect system files and directories from unauthorized modification."
  resolution: "Boot into macOS Recovery and run 'csrutil enable' in Terminal."
  query: SELECT 1 FROM sip_config WHERE config_flag = 'sip' AND enabled = 1;

- name: macOS - STIG - Automatic login disabled (APPL-15-000025 / IA-2)
  platform: darwin
  description: "DISA STIG APPL-15-000025: Automatic login (FDE auto-login) must be disabled to enforce user authentication at every startup."
  resolution: "Deploy the STIG macOS monoprofile (stig-macos-monoprofile.mobileconfig)."
  query: SELECT 1 FROM managed_policies WHERE domain='com.apple.loginwindow' AND name='DisableFDEAutoLogin' AND CAST(value AS INT) = 1;

- name: macOS - STIG - Firewall blocking all inbound connections (APPL-15-000007 / SC-7)
  platform: darwin
  description: "DISA STIG APPL-15-000007: The macOS firewall must be configured to block all incoming connections. Unlike 800-53, STIG requires BlockAllIncoming=true."
  resolution: "Deploy the STIG macOS monoprofile (stig-macos-monoprofile.mobileconfig)."
  query: |
    SELECT 1 FROM managed_policies
    WHERE domain = 'com.apple.security.firewall'
      AND username = ''
      AND name = 'BlockAllIncoming'
      AND CAST(value AS INT) = 1;

- name: macOS - STIG - Firewall stealth mode enabled (APPL-15-000010 / SC-7)
  platform: darwin
  description: "DISA STIG APPL-15-000010: Stealth mode must be enabled to prevent the system from responding to probe attempts."
  resolution: "Deploy the STIG macOS monoprofile (stig-macos-monoprofile.mobileconfig)."
  query: |
    SELECT 1 FROM managed_policies
    WHERE domain = 'com.apple.security.firewall'
      AND username = ''
      AND name = 'EnableStealthMode'
      AND CAST(value AS INT) = 1;

- name: macOS - STIG - Screen lock after 15 minutes (APPL-15-000001 / AC-11)
  platform: darwin
  description: "DISA STIG APPL-15-000001: The screen saver must be set to activate after no more than 15 minutes of inactivity."
  resolution: "Deploy the STIG macOS monoprofile (stig-macos-monoprofile.mobileconfig)."
  query: |
    SELECT 1 FROM managed_policies
    WHERE domain = 'com.apple.screensaver'
      AND name = 'idleTime'
      AND CAST(value AS INT) <= 900
      AND CAST(value AS INT) > 0;

- name: macOS - STIG - AirDrop disabled (APPL-15-002020 / AC-17) [STIG-unique]
  platform: darwin
  description: "DISA STIG APPL-15-002020: AirDrop must be disabled to prevent unauthorized data exfiltration over Bluetooth LE peer-to-peer connections. This control is unique to DISA STIG."
  resolution: "Deploy the STIG macOS monoprofile (stig-macos-monoprofile.mobileconfig) which sets allowAirDrop=false."
  query: |
    SELECT 1 FROM managed_policies
    WHERE domain = 'com.apple.applicationaccess'
      AND name = 'allowAirDrop'
      AND CAST(value AS INT) = 0;

- name: macOS - STIG - Time synchronization service running (AU-8)
  platform: darwin
  description: "DISA STIG AU-8: The system clock must be synchronized to authoritative time sources using the timed service."
  resolution: "Ensure the timed daemon is running: 'sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.timed.plist'."
  query: |
    SELECT 1 FROM launchd
    WHERE name = 'com.apple.timed'
      AND program IS NOT NULL;

- name: macOS - STIG - Audit logging (BSM auditd) active (APPL-15-004020 / AU-12)
  platform: darwin
  description: "DISA STIG APPL-15-004020: The BSM audit subsystem (auditd) must be active to generate audit records for security-relevant events."
  resolution: "Enable BSM auditing: 'sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.auditd.plist'."
  query: SELECT 1 FROM processes WHERE name = 'auditd' AND pid > 0;

- name: macOS - STIG - SSH not listening on default port or remote login disabled (APPL-15-000023 / AC-17)
  platform: darwin
  description: "DISA STIG APPL-15-000023: Remote Login (SSH) must be disabled unless required. Verify SSH is not accepting connections."
  resolution: "Disable Remote Login in System Settings > Sharing, or restrict SSH to approved users only with strong ciphers."
  query: |
    SELECT 1 WHERE NOT EXISTS (
      SELECT 1 FROM listening_ports
      WHERE port = 22 AND protocol = 'tcp' AND address != '127.0.0.1'
    );
