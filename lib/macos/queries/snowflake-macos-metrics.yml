# Thanks to Tom Larkin (https://t-lark.github.io/posts/building_endpoint_performance_metrics/)
- name: macOS Compute
  automations_enabled: false
  description: Extended chart to show statistics about enrolled Macs.
  discard_data: false
  interval: 0
  logging: snapshot
  observer_can_run: true
  platform: "darwin"
  query: SELECT
  p.pid,
  p.name,
  p.path,
  p.cmdline,
  p.uid,
  p.parent,

  -- CPU times (microseconds)
  p.user_time,
  p.system_time,
  (p.user_time + p.system_time) AS total_cpu_time_us,

  -- Resident memory (bytes)
  p.resident_size,
  ROUND(p.resident_size / (1024.0 * 1024.0), 2) AS resident_size_mb,

  -- System CPU core count
  ci.cpu_count,

  -- Approximate CPU percent (lifetime average)
  CASE
    WHEN p.user_time + p.system_time > 0 THEN
      ROUND(
        ((p.user_time + p.system_time) / 1000000.0) /
        (ps.uptime * ci.cpu_count) * 100.0,
        2
      )
    ELSE 0
  END AS approx_cpu_percent

FROM processes p
CROSS JOIN cpu_info ci
CROSS JOIN uptime ps

WHERE p.state = 'R'
  OR p.state = 'S'

ORDER BY approx_cpu_percent DESC
LIMIT 50;
