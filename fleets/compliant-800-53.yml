# NIST SP 800-53 Rev 5 High Baseline team configuration
# This team applies 800-53 High Impact controls to enrolled devices.
# Devices must be explicitly moved to this team; no currently enrolled devices are affected automatically.
#
# 800-53 coverage:
#   AC-3   - Disable guest account, FDE auto-login disabled
#   AC-7   - Account lockout after 3 failed attempts (Windows)
#   AC-11  - Session lock after 15 minutes of inactivity (all platforms)
#   AC-17  - Disable Bluetooth file sharing, remote access audit
#   CM-7   - Gatekeeper enabled (macOS)
#   IA-2   - Automatic login disabled, MFA enforcement via MDM
#   IA-5   - 15-char passwords, 60-day expiry, 24-password history, alphanumeric required
#   SC-7   - Application firewall with stealth mode, host-based firewall (Linux)
#   SI-2   - Automatic security updates (Linux)
#   SI-3   - Windows Defender real-time protection
#   SI-7   - System Integrity Protection (SIP) enabled (macOS)
#   AU-8   - Time synchronization active (Linux)
#   AU-12  - Audit logging enabled (all platforms)
#
# To enroll a device into this team, use the enrollment secret below
# or move an existing host via the Fleet UI / API.
# The secret must be added to GitHub Actions secrets as FLEET_COMPLIANT_800_53_ENROLL_SECRET.
#
# NOTE: The following are applied globally (default.yml) and intentionally omitted here
# to avoid running them twice on enrolled hosts:
#   Queries:  remote-access.yml, collect-mounted-volumes.yml
#   Policies: macos-device-health.policies.yml

name: 🔏 Compliant 800-53

policies:
  # --- AC-11 / IA-5 / SC-7 / SI-7 / CM-7 / AU-8 / AU-12 - macOS 800-53 High checks ---
  # (macos-device-health.policies.yml is GLOBAL via default.yml — not included here)
  - path: ../lib/macos/policies/800-53-macos.policies.yml
  # --- AC-7 / AC-11 / IA-5 / SI-3 / AU-12 - Windows device health + 800-53 checks ---
  - path: ../lib/windows/policies/windows-device-health.policies.yml
  - path: ../lib/windows/policies/800-53-windows.policies.yml
  # --- SC-7 / AC-3 / AU-12 / AU-8 / SI-2 - Linux 800-53 checks ---
  - path: ../lib/linux/policies/linux-device-health.policies.yml
  - path: ../lib/linux/policies/800-53-linux.policies.yml

queries:
  # AU-12 / AC-7 - Failed login attempt monitoring
  - path: ../lib/all/queries/collect-failed-login-attempts.queries.yml
  # AC-17 - USB device inventory for data loss prevention
  - path: ../lib/all/queries/collect-usb-devices.queries.yml
  # NOTE: remote-access.yml and collect-mounted-volumes.yml are GLOBAL (default.yml) — omitted here

agent_options:
  path: ../lib/agent-options.yml

controls:
  # SC-28 - Enforce full-disk encryption on all 800-53 team devices
  enable_disk_encryption: true

  macos_settings:
    custom_settings:
      # IA-5 (AC-11) - Passcode: min 15 chars, 2 complex chars, 15-min lock, max 3 failed attempts, 60-day expiry, 24-history
      - path: ../lib/macos/configuration-profiles/800-53-passcode.json
      # AC-3 / AC-11 / AC-17 / SC-7 / IA-2 - Firewall, login window, Bluetooth, screensaver monoprofile
      - path: ../lib/macos/configuration-profiles/800-53-macos-monoprofile.mobileconfig

  # SI-2 - Enforce macOS minimum version with a deadline
  macos_updates:
    deadline: "2026-06-30"
    minimum_version: "15.0"

  # SI-2 - Enforce Windows updates within 14 days with a 3-day grace period
  windows_updates:
    deadline_days: 14
    grace_period_days: 3

  # AC-7 / AC-11 / IA-5 - Windows device lock, password, and lockout policy monoprofile
  windows_settings:
    custom_settings:
      - path: ../lib/windows/configuration-profiles/800-53-windows-monoprofile.xml

  scripts:
    - path: ../lib/macos/scripts/collect-fleetd-logs.sh
    - path: ../lib/windows/scripts/rename-host.ps1

team_settings:
  secrets:
    - secret: "$FLEET_COMPLIANT_800_53_ENROLL_SECRET"
  features:
    enable_host_users: true
    enable_software_inventory: true

software:
