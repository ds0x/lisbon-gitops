# Fleets are available in Fleet Premium.

# This file updates policies, queries, agent options, controls, and software for hosts
# assigned to the "New Hires" fleet.

# To add another fleet, create a new file in the fleets/ directory and copy/paste the
# contents from this file. Update the secret in the new file, create the corresponding
# secret in GitHub Actions, then add it to .github/workflows/workflow.yml as an env var.
# The secret name in the YAML file must match the secret name in GitHub Actions.

agent_options:
  path: ../lib/all/agent-options/agent-options.yml
controls:
  scripts:
    - path: ../lib/macos/scripts/remove-zoom-artifacts.script.sh
    - path: ../lib/macos/scripts/set-dns-cloudflare.sh
  macos_settings:
    custom_settings:
      - path: ../lib/macos/configuration-profiles/disable-bluetooth-file-sharing.mobileconfig

name: 🪪 New Hires
policies:
  - path: ../lib/macos/policies/dns-resolvers.policies.yml
queries:
  - path: ../lib/all/queries/collect-failed-login-attempts.queries.yml
software:
  packages:
    - path: ../lib/macos/software/zoom.yml
settings:
  secrets:
    - secret: "$FLEET_NEW_HIRES_ENROLL_SECRET"
  features:
    enable_host_users: true
    enable_software_inventory: true
