# Fleets are available in Fleet Premium.

# This file updates policies, queries, agent options, controls, and software for hosts
# assigned to the "Workstations" fleet.

# To add another fleet, create a new file in the fleets/ directory and copy/paste the
# contents from this file. Update the secret in the new file, create the corresponding
# secret in GitHub Actions, then add it to .github/workflows/workflow.yml as an env var.
# The secret name in the YAML file must match the secret name in GitHub Actions.

agent_options:
  path: ../platforms/all/agent-options/agent-options.yml
controls:
  enable_disk_encryption: true
  setup_experience:
    macos_bootstrap_package: ""
    enable_end_user_authentication: false
    lock_end_user_info: false
    apple_setup_assistant: ../platforms/macos/enrollment-profiles/automatic-enrollment.dep.json
  scripts:
    - path: ../platforms/macos/scripts/remove-zoom-artifacts.script.sh
    - path: ../platforms/macos/scripts/user-alert.sh
    - path: ../platforms/macos/scripts/chrome-clear.sh
    - path: ../platforms/windows/scripts/default-exe-install-script.ps1
    - path: ../platforms/windows/scripts/rename-host.ps1
    - path: ../platforms/macos/scripts/nQ.sh
    - path: ../platforms/linux/scripts/install-fleet-desktop-required-extension.sh
    - path: ../platforms/linux/scripts/install-fleet-watchdog.sh
  macos_settings:
    custom_settings:
      - path: ../platforms/macos/configuration-profiles/com.apple.applicationaccess.mobileconfig
  windows_settings:
    custom_settings:
      - path: ../platforms/windows/configuration-profiles/disallow-manual-unenrollment.xml
  macos_updates:
    deadline: "2025-10-31"
    minimum_version: "26.0"
  ipados_updates:
    deadline: "2025-12-31"
    minimum_version: "26.0"
name: "💻 Workstations"
policies:
  - path: ../platforms/windows/policies/all-windows-updates-installed.policies.yml
  - path: ../platforms/linux/policies/check-fleet-desktop-extension-enabled.yml
  - path: ../platforms/linux/policies/disk-encryption-check.yml
  - path: ../platforms/linux/policies/disk-space-check.yml
  - path: ../platforms/linux/policies/fleet-watchdog-tamper-detected.yml
queries:
  - path: ../platforms/all/queries/collect-failed-login-attempts.queries.yml
software:
  app_store_apps:
    - app_store_id: "311421597"
      self_service: true
      setup_experience: true
    - app_store_id: "324715238"
      self_service: true
    - app_store_id: "6755752326"
      self_service: true
    - app_store_id: "300311831"
      self_service: true
    - app_store_id: "341776037"
      self_service: true
    - app_store_id: "430255202"
      platform: darwin
      setup_experience: true
      self_service: true
    - app_store_id: "com.evo.inware"
      platform: android
      setup_experience: true
      self_service: true
    - app_store_id: "618783545"
      display_name: Slack
      platform: ios
      self_service: true
    - app_store_id: "803453959"
      display_name: Slack
      platform: darwin
      self_service: true
    - app_store_id: "497799835"
      display_name: Xcode
      platform: darwin
      self_service: true
  fleet_maintained_apps:
    - slug: transmit/darwin
      setup_experience: true
      self_service: true
    - slug: 1password/windows
      self_service: true
      setup_experience: true
    - slug: vlc/windows
      self_service: true
    - slug: vlc/darwin
      self_service: true
    - slug: visual-studio-code/windows
      self_service: true
    - slug: visual-studio-code/darwin
      self_service: true
  packages:
    - path: ../platforms/linux/scripts/install-libreoffice.sh
      display_name: LibreOffice
      self_service: true
      labels_include_any:
        - Linux devices
    - path: ../platforms/linux/scripts/install-multipass.sh
      display_name: Multipass
      self_service: true
      labels_include_any:
        - Linux devices
    - path: ../platforms/linux/scripts/install-chromium.sh
      display_name: Chromium
      self_service: true
      labels_include_any:
        - Linux devices
    - path: ../platforms/linux/scripts/install-vscode.sh
      display_name: Visual Studio Code
      self_service: true
      labels_include_any:
        - Linux devices
    - path: ../platforms/linux/software/vivaldi-amd64-deb.yml
      self_service: true
      labels_include_any:
        - Linux x86 devices
    - path: ../platforms/linux/software/vivaldi-arm64-deb.yml
      self_service: true
      labels_include_any:
        - Linux ARM devices
    # - path: ../platforms/macos/software/user-alert-s2.sh
    #   display_name: User Alert Test
    #   self_service: true
settings:
  secrets:
    - secret: "$FLEET_WORKSTATIONS_ENROLL_SECRET"
  features:
    enable_host_users: true
    enable_software_inventory: true
