# DISA STIG Team Configuration
# Applies the latest DISA STIG baselines:
#   - macOS Sequoia STIG V1R6 (Feb 17, 2026)
#   - Windows 11 STIG V2R6 (Feb 19, 2026) / Windows 10 STIG V3R7 (Mar 3, 2026)
#   - RHEL 9 STIG V1R3+ / Ubuntu 22.04 LTS STIG V2R6 (Jan 28, 2026)
#
# Devices must be explicitly enrolled via FLEET_COMPLIANT_DISA_STIG_ENROLL_SECRET.
# Zero impact on existing teams (Workstations, Engineering, New Hires, Canary).
#
# Key STIG-specific controls beyond 800-53 High:
#   macOS:   BlockAllIncoming=true (firewall), AirDrop disabled (APPL-15-002020),
#            SSH not listening (APPL-15-000023)
#   Windows: NTLMv2 only / refuse LM+NTLM (WN11-CC-000068),
#            Credential Guard (WN11-CC-000075),
#            WinRM Basic Auth disabled (WN11-CC-000330),
#            SMBv1 disabled (WN11-000340), Autorun=255 (WN11-SO-000150)
#   Linux:   SELinux/AppArmor enforcing (RHEL-09-011010),
#            FIPS mode (RHEL-09-612200),
#            SSH approved ciphers only (RHEL-09-255075)
#
# NOTE: The following run globally via default.yml and are intentionally omitted:
#   Queries:  remote-access.yml, collect-mounted-volumes.yml
#   Policies: macos-device-health.policies.yml

name: 🫡 Compliant DISA-STIG

policies:
  # macOS STIG-specific checks (device-health baseline is already global)
  - path: ../lib/macos/policies/stig-macos.policies.yml
  # Windows: device health baseline + STIG-specific checks
  - path: ../lib/windows/policies/windows-device-health.policies.yml
  - path: ../lib/windows/policies/stig-windows.policies.yml
  # Linux: device health baseline + STIG-specific checks
  - path: ../lib/linux/policies/linux-device-health.policies.yml
  - path: ../lib/linux/policies/stig-linux.policies.yml

queries:
  # AU-12 / AC-7: Failed login attempt monitoring
  - path: ../lib/all/queries/collect-failed-login-attempts.queries.yml
  # AC-17: USB device inventory (removable media control)
  - path: ../lib/all/queries/collect-usb-devices.queries.yml
  # NOTE: remote-access.yml and collect-mounted-volumes.yml are global — omitted

agent_options:
  path: ../lib/agent-options.yml

controls:
  # SC-28: Full-disk encryption required on all STIG team devices
  enable_disk_encryption: true

  macos_settings:
    custom_settings:
      # IA-5 / AC-11 / AC-7: Passcode DDM — 15-char, 1 complex, 15-min lock, 3 attempts, 60-day, 24-history
      - path: ../lib/macos/configuration-profiles/stig-passcode.json
      # SC-7 / IA-2 / AC-11 / AC-17: Firewall (block all inbound), login window, BT sharing off, screensaver, AirDrop disabled
      - path: ../lib/macos/configuration-profiles/stig-macos-monoprofile.mobileconfig

  # SI-2: Enforce minimum macOS version with deadline
  macos_updates:
    deadline: "2026-06-30"
    minimum_version: "15.0"

  # SI-2: Windows updates within 14 days
  windows_updates:
    deadline_days: 14
    grace_period_days: 3

  # AC-7 / AC-11 / IA-5 / IA-7: Password, lockout, NTLMv2, Credential Guard, WinRM hardening
  windows_settings:
    custom_settings:
      - path: ../lib/windows/configuration-profiles/stig-windows-monoprofile.xml

  scripts:
    - path: ../lib/macos/scripts/collect-fleetd-logs.sh
    - path: ../lib/windows/scripts/rename-host.ps1

team_settings:
  secrets:
    - secret: "$FLEET_COMPLIANT_DISA_STIG_ENROLL_SECRET"
  features:
    enable_host_users: true
    enable_software_inventory: true

software:
