# Teams are available in Fleet Premium.

# This file updates policies, queries, agent options, controls, and software for hosts assigned to the "Workstations" team.

# To add another team, create a new file in the teams/ directory and copy and paste the contents from this file.
# Update the secret in the new file, then create the corresponding secret in GitHub Actions secrets.
# Then add that secret to .github/workflows/workflow.yml as an env variable.
# The secret name in the YAML file must match the secret name in GitHub Actions secrets.

agent_options:
  path: ../lib/agent-options.yml
controls:
  enable_disk_encryption: true
  scripts:
    - path: ../lib/macos/scripts/remove-zoom-artifacts.script.sh
    - path: ../lib/windows/scripts/default-exe-install-script.ps1
    - path: ../lib/windows/scripts/rename-host.ps1
    - path: ../lib/macos/scripts/nQ.sh
  macos_settings:
    custom_settings:
      - path: ../lib/macos/configuration-profiles/passcode-settings-ddm.json
  macos_updates:
    deadline: "2025-10-31"
    minimum_version: "26.0"
  ipados_updates:
    deadline: "2025-12-31"
    minimum_version: "26.0"
name: 🛠️ Engineering
policies:
  - path: ../lib/windows/policies/all-windows-updates-installed.policies.yml
queries:
  - path: ../lib/all/queries/collect-failed-login-attempts.queries.yml
software:
  app_store_apps:
    # - app_store_id: "311421597"
    #   self_service: true
    #   setup_experience: true
    # - app_store_id: "311421597"
    #   self_service: true
    #   setup_experience: true
    # - app_store_id: "324715238"
    #   self_service: true
    # - app_store_id: "6755752326"
    #   self_service: true
    # - app_store_id: "300311831"
    #   self_service: true
    # - app_store_id: "341776037"
    #   self_service: true
    # - app_store_id: "430255202"
    #   platform: darwin
    #   setup_experience: true
    #   self_service: true
    - app_store_id: "com.evo.inware"
      platform: android
      setup_experience: true
      self_service: true
  fleet_maintained_apps:
    - slug: transmit/darwin # Privileges for macOS
      setup_experience: true
      self_service: true
  fleet_maintained_apps:
    - slug: 1password/windows
      self_service: true
      setup_experience: true
    - slug: vlc/windows
      self_service: true
    - slug: vlc/darwin
      self_service: true
  packages:
    - url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
      self_service: true
    - path: ../lib/linux/scripts/install-libreoffice.sh
      self_service: true
    - path: ../lib/linux/scripts/install-multipass.sh
      self_service: true
team_settings:
  secrets:
    - secret: "$FLEET_ENGINEERING_ENROLL_SECRET"
  features:
    enable_host_users: true
    enable_software_inventory: true
