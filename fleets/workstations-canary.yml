# Fleets are available in Fleet Premium.

# This file updates policies, queries, agent options, controls, and software for hosts
# assigned to the "Workstations (canary)" fleet. Use it to validate changes on a small
# set of hosts before rolling them out to the "Workstations" fleet.

name: 🧪 Workstations (canary)
policies:
  - path: ../platforms/macos/policies/macos-device-health.policies.yml
  - path: ../platforms/windows/policies/windows-device-health.policies.yml
  - path: ../platforms/linux/policies/linux-device-health.policies.yml
queries:
  - path: ../platforms/all/queries/collect-usb-devices.queries.yml
  - path: ../platforms/all/queries/collect-failed-login-attempts.queries.yml
agent_options:
  path: ../platforms/all/agent-options/agent-options.yml
controls:
  scripts:
    - path: ../platforms/macos/scripts/remove-zoom-artifacts.script.sh
    - path: ../platforms/macos/scripts/set-timezone.script.sh
    - path: ../platforms/linux/scripts/wsl-alert.sh
settings:
  secrets:
    - secret: "$FLEET_WORKSTATIONS_CANARY_ENROLL_SECRET"
  features:
    enable_host_users: true
    enable_software_inventory: true
software:
